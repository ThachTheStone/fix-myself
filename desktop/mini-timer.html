<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Fix Myself timer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      box-sizing: border-box; padding: 8px 14px; background: #183d2f; color: #f6f5ef;
      font: 13px system-ui, 'Segoe UI', sans-serif; -webkit-app-region: drag; user-select: none;
      display: flex; flex-direction: column; justify-content: center;
    }
    #time { font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
    #line { display: flex; gap: 6px; min-width: 0; white-space: nowrap; }
    #label { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #status { color: #d7efad; flex: none; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="time">0:00</div>
  <div id="line"><span id="label"></span><span id="status"></span></div>
  <script src="mini-timer.js"></script>
</body>
</html>
